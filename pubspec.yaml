  for Lemsa Flutter apps.
version: 1.0.0
homepage: https://github.com/fodilfliti/flutter_app_kit
repository: https://github.com/fodilfliti/flutter_app_kit
issue_tracker: https://github.com/fodilfliti/flutter_app_kit/issues
documentation: https://github.com/fodilfliti/flutter_app_kit#readme

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_page_kit: ^1.0.0
  flutter_secure_storage: ^11.0.0
  lemsa_core_kit: ^1.0.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^9.0.0

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

topics:
  - flutter
  - bootstrap
  - secure-storage
  - snackbar
  - flavors
