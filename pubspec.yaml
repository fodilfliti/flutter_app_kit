name: flutter_app_kit
description: >
  App bootstrap, flavors, secure session storage, and Material Notices
  for Lemsa Flutter apps.
version: 0.0.1
publish_to: none
homepage: https://github.com/fodilfliti/flutter_app_kit
repository: https://github.com/fodilfliti/flutter_app_kit
issue_tracker: https://github.com/fodilfliti/flutter_app_kit/issues
documentation: https://github.com/fodilfliti/flutter_app_kit#readme

environment:
  sdk: ^3.7.2
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_page_kit:
    path: ../flutter_page_kit
  flutter_secure_storage: ^10.3.3
  lemsa_core_kit:
    path: ../lemsa_core_kit
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^9.0.0

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

topics:
  - flutter
  - bootstrap
  - secure-storage
  - snackbar
  - flavors
